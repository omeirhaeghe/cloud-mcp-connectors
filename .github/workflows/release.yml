name: Release connector image

on:
  push:
    tags:
      - 'connector-*-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Parse tag
        id: tag
        run: |
          # Tag format: connector-<id>-v<version>
          tag="${GITHUB_REF_NAME}"
          name="${tag#connector-}"
          id="${name%-v*}"
          version="${name##*-v}"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: connectors/${{ steps.tag.outputs.id }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cloud-connector-${{ steps.tag.outputs.id }}:${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/cloud-connector-${{ steps.tag.outputs.id }}:latest
